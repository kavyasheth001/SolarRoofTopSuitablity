# Local open-source GIS stack for SolarSight (pilot).
#   PostGIS   -> localhost:5433  (5432 is taken by the host's own PostgreSQL 17)
#   GeoServer -> http://localhost:8600/geoserver
#   Static    -> http://localhost:8601  (3D Tiles, terrain, basemap files from infra/data/static)
# Credentials come from infra/.env (local test values, git-ignored).
name: solarsight-gis

services:
  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION:-3.0.2}
    restart: unless-stopped
    env_file: .env
    environment:
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,HEAD,OPTIONS"
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "vectortiles"
    ports:
      - "8600:8080"
    volumes:
      - ./data/geoserver:/opt/geoserver_data
    depends_on:
      postgis:
        condition: service_healthy

  static:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8601:80"
    volumes:
      - ./data/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
