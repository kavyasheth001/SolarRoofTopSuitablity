server {
    listen 80;
    root /usr/share/nginx/html;

    # 3D Tiles / terrain / PMTiles are fetched cross-origin by the Vite app.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    types {
        application/json json;
        model/gltf-binary glb;
        application/octet-stream b3dm pnts i3dm cmpt subtree pmtiles;
    }

    location / {
        try_files $uri =404;
    }

    # Reality Mesh mirrored in I3S layout (tools/reality/mirror.mjs). CesiumJS asks for REST-style paths
    # with a trailing slash (".../nodepages/3/"); documents are stored as files, folders hold index.json.
    location /i3s/ {
        rewrite ^(.+)/$ $1 last;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400";   # success only, so a 404 is never kept
        location = /i3s/manifest.json { add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-cache" always; try_files $uri =404; }
        location ~ /geometries/\d+$ { default_type application/octet-stream; add_header Access-Control-Allow-Origin * always; try_files $uri =404; }
        location ~ /textures/[^/]+$ { default_type image/jpeg; add_header Access-Control-Allow-Origin * always; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
        try_files $uri $uri/index.json =404;
    }

    # Quantized-mesh terrain tiles from cesium-terrain-builder are stored gzip-compressed,
    # so the browser must be told to decompress them. (add_header here replaces the
    # server-level headers, so CORS is repeated.)
    location ~* \.terrain$ {
        default_type application/vnd.quantized-mesh;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache" always;   # revalidate, so a rebuilt tileset is picked up
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Encoding" always;
        try_files $uri =404;
    }
}
